name: Build Xiaomi Trinket Kernel with KernelSU-Next & SuSFS

on:
  workflow_dispatch:
    inputs:
      target_device:
        description: "Target Device (mitrinket: unified Note 8/8T & Mi A3, ginkgo: Note 8/8T, laurel_sprout: Mi A3, all: both)"
        required: true
        type: choice
        options:
          - "mitrinket"
          - "ginkgo"
          - "laurel_sprout"
          - "all"
        default: "mitrinket"
      su_variant:
        description: "SU / Root Variant to build"
        required: true
        type: choice
        options:
          - "sukisu_uapi6_susfs"
          - "ksun_uapi5_susfs"
          - "all_variants"
          - "official_ksu"
          - "vanilla"
          - "ksun_uapi6_nosusfs"
          - "ksun_uapi5_nosusfs"
          - "kowsu"
        default: "sukisu_uapi6_susfs"
      clang_type:
        description: "Toolchain / Compiler (proton: Proton Clang 13 [recommended], aosp: AOSP Clang, zyc: ZyC Clang, rm69: RastaMod69)"
        required: true
        type: choice
        options:
          - "proton"
          - "aosp"
          - "zyc"
          - "rm69"
        default: "proton"
      release_tag:
        description: "GitHub Release Tag to publish/update"
        required: false
        type: string
        default: "Revision-3"
      make_release:
        description: "Publish/Attach to GitHub Release"
        required: false
        type: boolean
        default: true

jobs:
  setup:
    name: Setup Build Matrix
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          if [ "${{ inputs.su_variant }}" = "all_variants" ]; then
            echo 'matrix=["sukisu_uapi6_susfs", "ksun_uapi5_susfs", "official_ksu", "vanilla", "ksun_uapi6_nosusfs", "ksun_uapi5_nosusfs", "kowsu"]' >> $GITHUB_OUTPUT
          else
            echo 'matrix=["${{ inputs.su_variant }}"]' >> $GITHUB_OUTPUT
          fi

  build:
    name: Build ${{ matrix.variant }} (${{ inputs.target_device }})
    needs: setup
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.setup.outputs.matrix) }}
    permissions:
      contents: write

    steps:
      - name: Free Runner Disk Space
        run: |
          echo "=== Freeing disk space ==="
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -a -f || true
          df -h

      - name: Checkout Builder Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev lz4 cpio kmod git curl \
            zip unzip file dwarves python3 python-is-python3 tar wget jq rsync xz-utils perl \
            ccache binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi libncurses5-dev xxd
          sudo apt-get install -y libtinfo5 || true

      - name: Setup Swap Memory
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=16384
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Clone Kernel Source
        run: |
          echo "=== Cloning FlopKernel-Series/flop_trinket-mi_kernel branch floppy-unity ==="
          git clone --depth=1 -b floppy-unity https://github.com/FlopKernel-Series/flop_trinket-mi_kernel.git $GITHUB_WORKSPACE/kernel
          cd $GITHUB_WORKSPACE/kernel
          echo "Latest commit:"
          git log -1 --oneline

      - name: Configure Variant & Patches
        id: configure
        run: |
          cd $GITHUB_WORKSPACE
          touch bot_token chat chat_test

          cd $GITHUB_WORKSPACE/kernel

          # 1. Fix duplicate --plugin-opt=-import-instr-limit in Makefile that causes ld.lld error during vdso build
          sed -i '/--plugin-opt=-import-instr-limit=5/d' Makefile

          # 2. Patch post.sh to ensure mitrinket unified device codename check matches properly (bash [[ ... || ... ]])
          if [ -f "build/scripts/post.sh" ]; then
            sed -i 's/"$CODENAME" == "unified"/"$CODENAME" == "mitrinket" || "$CODENAME" == "unified"/' build/scripts/post.sh
          fi

          # 3. Add set -e to ckbuild.sh & disable 0x0.st upload timeout
          if [ -f "build/ckbuild.sh" ]; then
            sed -i '1a set -e' build/ckbuild.sh
            sed -i 's/LOG_UPLOAD=1/LOG_UPLOAD=0/' build/ckbuild.sh
          fi

          # 4. Inject FloppyKernel Revision 3 (R3) Ultra Optimizations
          echo "=== Injecting FloppyKernel Revision 3 (R3) Ultra Optimizations ==="
          
          # A. Network & BBR with FQ hardware pacing
          {
            echo "CONFIG_TCP_CONG_ADVANCED=y"
            echo "CONFIG_TCP_CONG_BBR=y"
            echo 'CONFIG_DEFAULT_TCP_CONG="bbr"'
            echo "CONFIG_NET_SCH_FQ=y"
            echo 'CONFIG_DEFAULT_NET_SCH="fq"'
            echo "CONFIG_DEFAULT_FQ=y"
          } >> arch/arm64/configs/vendor/xiaomi-trinket.config

          # B. ZRAM ZSTD Ultra Compression (Disable Dedup CPU hashing)
          {
            echo "CONFIG_CRYPTO_ZSTD=y"
            echo "CONFIG_ZSTD_COMPRESS=y"
            echo "CONFIG_ZSTD_DECOMPRESS=y"
            echo "CONFIG_ZRAM=y"
            echo 'CONFIG_ZRAM_DEFAULT_COMP_ALGORITHM="zstd"'
          } >> arch/arm64/configs/vendor/xiaomi-trinket.config
          sed -i 's/CONFIG_ZRAM_DEDUP=y/# CONFIG_ZRAM_DEDUP is not set/' arch/arm64/configs/vendor/trinket-perf_defconfig

          # C. Display & Fast Charging
          {
            echo "CONFIG_SUSPEND_SKIP_SYNC=y"
            echo "CONFIG_DRM_MSM_KCAL_CTRL=y"
            echo "CONFIG_FORCE_FAST_CHARGE=y"
          } >> arch/arm64/configs/vendor/xiaomi-trinket.config

          # D. Frame-Perfect 300Hz Timer Frequency (Divides evenly into 60 FPS: 5 ticks/frame)
          sed -i 's/CONFIG_HZ_250=y/CONFIG_HZ_300=y/' arch/arm64/configs/vendor/trinket-perf_defconfig
          sed -i 's/CONFIG_HZ=250/CONFIG_HZ=300/' arch/arm64/configs/vendor/trinket-perf_defconfig

          # E. Multi-Queue I/O Scheduler: BFQ for eMMC 5.1 Storage (Foreground UI priority)
          sed -i 's/# CONFIG_IOSCHED_BFQ is not set/CONFIG_IOSCHED_BFQ=y\nCONFIG_BFQ_GROUP_IOSCHED=y/' arch/arm64/configs/vendor/trinket-perf_defconfig
          sed -i 's/CONFIG_DEFAULT_MQ_IOSCHED="kyber"/CONFIG_DEFAULT_MQ_IOSCHED="bfq"/' arch/arm64/configs/vendor/trinket-perf_defconfig

          # F. Touchscreen Latency Stripping (Disable debug logging on touch interrupts)
          sed -i 's/CONFIG_TOUCHSCREEN_HIMAX_DEBUG=y/# CONFIG_TOUCHSCREEN_HIMAX_DEBUG is not set/' arch/arm64/configs/vendor/trinket-perf_defconfig
          sed -i 's/CONFIG_TOUCHSCREEN_SYNAPTICS_TCM_TESTING=y/# CONFIG_TOUCHSCREEN_SYNAPTICS_TCM_TESTING is not set/' arch/arm64/configs/vendor/trinket-perf_defconfig
          sed -i 's/CONFIG_TOUCHSCREEN_SYNAPTICS_TCM_DIAGNOSTICS=y/# CONFIG_TOUCHSCREEN_SYNAPTICS_TCM_DIAGNOSTICS is not set/' arch/arm64/configs/vendor/trinket-perf_defconfig

          # G. GPU Turbo & Devfreq
          {
            echo "CONFIG_DEVFREQ_GOV_QCOM_ADRENO_TZ=y"
            echo "CONFIG_DEVFREQ_GOV_PERFORMANCE=y"
          } >> arch/arm64/configs/vendor/xiaomi-trinket.config

          VARIANT="${{ matrix.variant }}"
          BUILD_OPTS="c"
          VARIANT_TAG=""
          LOCAL_VER=""

          case "$VARIANT" in
            sukisu_uapi6_susfs|sukisu_uapi5)
              BUILD_OPTS="sc"
              VARIANT_TAG="SukiSU-uapi6-SUSFS"
              LOCAL_VER="-Floppy-R3-SukiSU-uapi6-susfs"
              # Enable multi-manager support in sukisu.config
              sed -i 's/# CONFIG_KSU_MULTI_MANAGER_SUPPORT is not set/CONFIG_KSU_MULTI_MANAGER_SUPPORT=y/' arch/arm64/configs/sukisu.config
              # Patch EXPECTED_HASH_BAKASU to match SukiSU Nova v3.0.0 key (size 0x35c, hash 947ae944f3de4ed4c21a7e4f7953ecf351bfa2b36239da37a34111ad29993eef)
              sed -i 's/EXPECTED_SIZE_BAKASU 0x377/EXPECTED_SIZE_BAKASU 0x35c/' drivers/sukisu/kernel/manager/manager_sign.h
              sed -i 's/EXPECTED_HASH_BAKASU "d3469712b6214462764a1d8d3e5cbe1d6819a0b629791b9f4101867821f1df64"/EXPECTED_HASH_BAKASU "947ae944f3de4ed4c21a7e4f7953ecf351bfa2b36239da37a34111ad29993eef"/' drivers/sukisu/kernel/manager/manager_sign.h
              # Bump SukiSU UAPI version from 5 to 6 to match SukiSU Nova v3.0.0 (30000-6)
              sed -i 's/KERNEL_SU_UAPI_VERSION = 5/KERNEL_SU_UAPI_VERSION = 6/' drivers/sukisu/uapi/supercall.h
              ;;
            ksun_uapi5_susfs)
              BUILD_OPTS="kc"
              VARIANT_TAG="KSUNext-uapi5-SUSFS"
              LOCAL_VER="-Floppy-R3-KSUN-uapi5-susfs"
              # Set UAPI version to 5 in supercall.h
              sed -i 's/#define KERNEL_SU_UAPI_VERSION 6/#define KERNEL_SU_UAPI_VERSION 5/' drivers/kernelsu/uapi/supercall.h
              ;;
            ksun_uapi6_susfs)
              BUILD_OPTS="kc"
              VARIANT_TAG="KSUNext-uapi6-SUSFS"
              LOCAL_VER="-Floppy-R3-KSUN-uapi6-susfs"
              ;;
            ksun_uapi6_nosusfs)
              BUILD_OPTS="kc"
              VARIANT_TAG="KSUNext-uapi6-NoSUSFS"
              LOCAL_VER="-Floppy-R3-KSUN-uapi6-nosusfs"
              # Disable SuSFS in ksu.config
              sed -i 's/^CONFIG_KSU_SUSFS/# CONFIG_KSU_SUSFS/g' arch/arm64/configs/ksu.config
              ;;
            ksun_uapi5_nosusfs)
              BUILD_OPTS="kc"
              VARIANT_TAG="KSUNext-uapi5-NoSUSFS"
              LOCAL_VER="-Floppy-R3-KSUN-uapi5-nosusfs"
              # Set UAPI version to 5 and disable SuSFS
              sed -i 's/#define KERNEL_SU_UAPI_VERSION 6/#define KERNEL_SU_UAPI_VERSION 5/' drivers/kernelsu/uapi/supercall.h
              sed -i 's/^CONFIG_KSU_SUSFS/# CONFIG_KSU_SUSFS/g' arch/arm64/configs/ksu.config
              ;;
            kowsu)
              BUILD_OPTS="xc"
              VARIANT_TAG="KowSU-XXKSU"
              LOCAL_VER="-Floppy-R3-KowSU-XXKSU"
              ;;
            official_ksu)
              BUILD_OPTS="kc"
              VARIANT_TAG="Official-KernelSU-v0.9.5"
              LOCAL_VER="-Floppy-R3-Official-KSU-v0.9.5"
              # Replace drivers/kernelsu with official tiann/KernelSU v0.9.5
              rm -rf drivers/kernelsu
              git clone --depth=1 -b v0.9.5 https://github.com/tiann/KernelSU.git drivers/kernelsu
              # Download official ksud-aarch64 and generate embed_ksud.c
              curl -LSs https://github.com/tiann/KernelSU/releases/download/v0.9.5/ksud-aarch64-linux-android -o /tmp/ksud
              chmod +x /tmp/ksud
              xxd -i /tmp/ksud | sed 's/_tmp_ksud_len/ksud_size/' | sed 's/unsigned char _tmp_ksud/const char ksud/' > drivers/kernelsu/kernel/embed_ksud.c
              # Set version and flags in drivers/kernelsu/kernel/Makefile
              sed -i 's/KSU_GIT_VERSION := .*/KSU_GIT_VERSION := 11858/' drivers/kernelsu/kernel/Makefile || true
              echo "ccflags-y += -w" >> drivers/kernelsu/kernel/Makefile
              # Disable manual hook & susfs in ksu.config so it uses kprobes cleanly
              sed -i 's/^CONFIG_KSU_MANUAL_HOOK/# CONFIG_KSU_MANUAL_HOOK/g' arch/arm64/configs/ksu.config
              sed -i 's/^CONFIG_KSU_SUSFS/# CONFIG_KSU_SUSFS/g' arch/arm64/configs/ksu.config
              ;;
            vanilla)
              BUILD_OPTS="c"
              VARIANT_TAG="Vanilla-APatch-Folkpatch"
              LOCAL_VER="-Floppy-R3-Vanilla-APatch-Folkpatch"
              ;;
            *)
              echo "Unknown variant: $VARIANT"
              exit 1
              ;;
          esac

          echo "Configured variant: $VARIANT -> Tag: $VARIANT_TAG, Build Opts: $BUILD_OPTS, LocalVer: $LOCAL_VER"
          echo "build_opts=$BUILD_OPTS" >> $GITHUB_OUTPUT
          echo "variant_tag=$VARIANT_TAG" >> $GITHUB_OUTPUT
          echo "local_ver=$LOCAL_VER" >> $GITHUB_OUTPUT

          # Patch localversion in build.sh
          if [ -f "build/scripts/build.sh" ]; then
            sed -i "s/VERSION_STR=\"\\\\\"-Floppy-\\\$FK_VER-\\\$CK_TYPE_SHORT\\\\\"\"/VERSION_STR=\"\\\\\"$LOCAL_VER\\\\\"\"/" build/scripts/build.sh
          fi

      - name: Compile Kernel
        run: |
          cd $GITHUB_WORKSPACE/kernel
          export WP="$GITHUB_WORKSPACE"
          export CLANG_TYPE="${{ inputs.clang_type }}"
          export USE_CCACHE=1
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          mkdir -p "$CCACHE_DIR"

          echo "=== Starting Kernel Compilation ==="
          echo "Device Target : ${{ inputs.target_device }}"
          echo "Build Options : ${{ steps.configure.outputs.build_opts }}"
          echo "Variant Tag   : ${{ steps.configure.outputs.variant_tag }}"

          START_TIME=$(date +%s)
          bash do_build.sh "${{ inputs.target_device }}" "${{ steps.configure.outputs.build_opts }}"
          END_TIME=$(date +%s)
          echo "Compilation finished in $((END_TIME - START_TIME)) seconds."

      - name: Package & Name Output
        id: package
        run: |
          cd $GITHUB_WORKSPACE
          mkdir -p $GITHUB_WORKSPACE/output
          BUILD_DATE=$(date "+%Y%m%d-%H%M")
          VARIANT_TAG="${{ steps.configure.outputs.variant_tag }}"
          TARGET_DEV="${{ inputs.target_device }}"

          echo "=== Locating built AnyKernel3 flashable zip ==="
          RAW_ZIP=$(find kernel/build/ -name "*.zip" | head -n 1)
          if [ -z "$RAW_ZIP" ] || [ ! -f "$RAW_ZIP" ]; then
            echo "::error::No flashable zip found in kernel/build/!"
            exit 1
          fi

          FINAL_ZIP_NAME="Floppy_v2.0-R3-${VARIANT_TAG}-${TARGET_DEV}-${BUILD_DATE}.zip"

          echo "=== Injecting 00-floppy-perf.sh post-boot script into AnyKernel3 ==="
          TMP_AK3_DIR=$(mktemp -d)
          unzip -q "$RAW_ZIP" -d "$TMP_AK3_DIR"
          cat << 'EOF' > "$TMP_AK3_DIR/00-floppy-perf.sh"
#!/system/bin/sh
# FloppyKernel R3 Auto-Perf & GPU Turbo Boot Service

# 1. GPU Adreno 610 Max Power & Turbo 950MHz
echo 0 > /sys/class/kgsl/kgsl-3d0/max_pwrlevel 2>/dev/null
echo 3 > /sys/class/kgsl/kgsl-3d0/min_pwrlevel 2>/dev/null
echo 0 > /sys/class/kgsl/kgsl-3d0/throttling 2>/dev/null

# 2. CPU Auto-Perf Schedutil Ramp-Up & WALT
for pol in /sys/devices/system/cpu/cpufreq/policy*; do
  echo 500 > $pol/schedutil/up_rate_limit_us 2>/dev/null
  echo 20000 > $pol/schedutil/down_rate_limit_us 2>/dev/null
done

# 3. I/O Scheduler & eMMC 5.1 Storage Priority (BFQ + 128KB Read-ahead)
for blk in /sys/block/mmcblk*; do
  echo bfq > $blk/queue/scheduler 2>/dev/null
  echo 128 > $blk/queue/read_ahead_kb 2>/dev/null
done

# 4. Storage & VM Memory Tuning
echo 5 > /proc/sys/vm/dirty_background_ratio 2>/dev/null
echo 20 > /proc/sys/vm/dirty_ratio 2>/dev/null
echo 100 > /proc/sys/vm/vfs_cache_pressure 2>/dev/null
EOF
          chmod 755 "$TMP_AK3_DIR/00-floppy-perf.sh"

          if [ -f "$TMP_AK3_DIR/anykernel.sh" ]; then
            sed -i '/write_boot;/a \
if [ -d /data/adb/service.d ]; then\
  ui_print "  • Installing Floppy R3 Auto-Perf post-boot service...";\
  cp -f $home/00-floppy-perf.sh /data/adb/service.d/00-floppy-perf.sh;\
  chmod 755 /data/adb/service.d/00-floppy-perf.sh;\
fi;' "$TMP_AK3_DIR/anykernel.sh"
          fi

          cd "$TMP_AK3_DIR"
          zip -r -q "$GITHUB_WORKSPACE/output/$FINAL_ZIP_NAME" .
          cd "$GITHUB_WORKSPACE"
          rm -rf "$TMP_AK3_DIR"

          cd $GITHUB_WORKSPACE/output
          echo "final_zip=$FINAL_ZIP_NAME" >> $GITHUB_OUTPUT
          echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT
          ls -lh

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Trinket-${{ inputs.target_device }}-${{ matrix.variant }}-${{ steps.package.outputs.build_date }}
          path: |
            ${{ github.workspace }}/output/*
            ${{ github.workspace }}/kernel/out/.config

      - name: Attach Artifact to GitHub Release
        if: inputs.make_release == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FINAL_ZIP: ${{ steps.package.outputs.final_zip }}
        run: |
          cd $GITHUB_WORKSPACE/output
          RELEASE_TAG="${{ inputs.release_tag }}"
          echo "=== Uploading $FINAL_ZIP to Release: $RELEASE_TAG ==="
          for attempt in {1..5}; do
            echo "Upload attempt $attempt..."
            if gh release upload "$RELEASE_TAG" "$FINAL_ZIP" --repo "$GITHUB_REPOSITORY" --clobber; then
              echo "Upload successful!"
              exit 0
            fi
            echo "Upload failed or busy, retrying in 15s..."
            sleep 15
          done
          echo "Failed to upload to release after 5 attempts"
          exit 1
